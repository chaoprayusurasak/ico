name: Keep Supabase Active

on:
  schedule:
    # Runs at 09:17 and 21:17 in Thailand (UTC+7).
    # Using a non-zero minute reduces contention with busy hourly schedules.
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query one record from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Keep the Supabase response body in the Actions log when a request fails.
          curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/items?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
