  <style>
    /* ===== SPU TRAIN SECTION - PASTEL SOFT COLORED, DYNAMIC SPEED & FLUFFY CLOUD TREES ===== */
    .spu-train-container {
      position: relative;
      width: 100%;
      height: 130px;
      margin-top: 10px;
      background-color: transparent;
      overflow: hidden;
      user-select: none;
      font-family: 'Prompt', sans-serif;
    }

    /* 1. STATION SIGN (Muted Soft Slate Blue Box + Dual Posts + Circle Badge) */
    .spu-station-sign {
      position: absolute;
      left: 100px;
      top: 18px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spu-sign-board {
      background: #1e293b;
      color: #ffffff;
      padding: 6px 14px 6px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
      border: 1px solid #334155;
    }

    .spu-sign-text {
      display: flex;
      flex-direction: column;
    }

    .spu-sign-th {
      font-weight: 700;
      font-size: 13px;
      color: #f8fafc;
      line-height: 1.2;
      white-space: nowrap;
    }

    .spu-sign-en {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.1;
      margin-top: 2px;
      white-space: nowrap;
    }

    .spu-sign-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .spu-sign-poles {
      display: flex;
      justify-content: space-between;
      width: 65%;
      height: 38px;
    }

    .spu-pole {
      width: 3px;
      height: 100%;
      background: #cbd5e1;
    }

    /* 2. ELEVATED TRACK BEAM (Muted Soft Slate Tones) */
    .spu-train-track-area {
      position: absolute;
      top: 102px;
      left: 0;
      width: 100%;
      height: 40px;
      z-index: 20;
    }

    .spu-track-beam-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #94a3b8;
    }

    .spu-track-beam-main {
      position: absolute;
      top: 3px;
      left: 0;
      width: 100%;
      height: 14px;
      background: linear-gradient(to bottom, #cbd5e1, #94a3b8);
      border-bottom: 1.5px solid #94a3b8;
    }

    .spu-track-beam-shadow {
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #64748b;
      opacity: 0.3;
    }

    /* 3. ANIMATED BTS TRAIN (DYNAMIC SPEED: FAST -> SLOW GLIDE -> ACCELERATE EXIT) */
    .spu-train-wrapper {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 520px;
      height: 54px;
      animation: spuTrainVariableSpeed 18s cubic-bezier(0.35, 0, 0.25, 1) infinite;
      will-change: transform;
      z-index: 35;
    }

    /* Keyframes for Variable Speed (Fast -> Slow -> Fast) */
    @keyframes spuTrainVariableSpeed {
      0% {
        transform: translateX(100vw);
      }

      25% {
        transform: translateX(65vw);
        /* Fast entry */
      }

      55% {
        transform: translateX(30vw);
        /* Slow smooth glide past station */
      }

      75% {
        transform: translateX(5vw);
        /* Gentle cruise */
      }

      100% {
        transform: translateX(-560px);
        /* Speeds up and exits */
      }
    }

    .spu-bts-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.12));
    }

    /* 4. T-SHAPED CONCRETE PILLARS (Softer Muted Slate) */
    .spu-pillars-container {
      position: absolute;
      top: 110px;
      left: 0;
      width: 100%;
      height: 70px;
      z-index: 10;

      flex-direction: column;
      align-items: center;
    }

    .spu-pillar-cap {

      background: #94a3b8;
      border-radius: 1px;

    .tree-trunk {

        0 -8px 0 -2px #a7f3d0,
        0 4px 8px rgba(0, 0, 0, 0.15);
      margin-bottom: -4px;
    }

    .cloud-tree-head.lg {
      width: 58px;
      height: 42px;
    }

    /* RESPONSIVE SCALING FOR MOBILE */
    @media (max-width: 768px) {
